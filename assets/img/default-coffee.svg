<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">B L E N D Default Coffee Illustration</title>
  <desc id="desc">Ilustrasi cangkir kopi minimalis berlatar transparan dalam palet biru tua dan oat.</desc>
  <defs>
    <linearGradient id="cupBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="100%" stop-color="#e2d5be"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e325c"/>
      <stop offset="100%" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe6"/>
      <stop offset="100%" stop-color="#d5c8b0"/>
    </linearGradient>
  </defs>

  <!-- Piring / alas -->
  <ellipse cx="160" cy="264" rx="78" ry="17" fill="url(#plate)" opacity="0.55"/>
  <ellipse cx="160" cy="260" rx="62" ry="12" fill="#f4efe6" opacity="0.35"/>

  <!-- Gagang cangkir -->
  <path d="M226 140h16a26 26 0 0 1 0 52h-16" fill="none" stroke="#f4efe6" stroke-width="14" stroke-linecap="round"/>

  <!-- Badan cangkir -->
  <path d="M88 116h140l-11 102a18 18 0 0 1-18 16h-82a18 18 0 0 1-18-16z" fill="url(#cupBody)" stroke="#f4efe6" stroke-width="5" stroke-linejoin="round"/>

  <!-- Permukaan kopi -->
  <ellipse cx="158" cy="116" rx="70" ry="15" fill="url(#liquid)" stroke="#f4efe6" stroke-width="5"/>

  <!-- Crema -->
  <path d="M120 112c14-7 28-9 42-5 11 3 19 8 31 7" fill="none" stroke="#e2d5be" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M130 120c11-4 22-5 33-2" fill="none" stroke="#d5c8b0" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Uap -->
  <g fill="none" stroke="#f4efe6" stroke-width="5.5" stroke-linecap="round" opacity="0.65">
    <path d="M132 84c-7-9 7-15 0-24"/>
    <path d="M158 78c-7-11 7-17 0-28"/>
    <path d="M184 84c-7-9 7-15 0-24"/>
  </g>

  <!-- Label band -->
  <rect x="108" y="170" width="100" height="32" rx="16" fill="#14213d"/>
  <text x="158" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#f4efe6">BLEND</text>

  <!-- Biji kopi dekoratif -->
  <g fill="#f4efe6" opacity="0.85">
    <ellipse cx="46" cy="252" rx="11" ry="7" transform="rotate(-24 46 252)"/>
    <ellipse cx="274" cy="246" rx="11" ry="7" transform="rotate(22 274 246)"/>
  </g>
  <g stroke="#14213d" stroke-width="1.8" stroke-linecap="round" opacity="0.55">
    <path d="M39 253l14-1"/>
    <path d="M267 242l14 8"/>
  </g>
</svg>
